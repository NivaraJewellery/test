<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nivara Jewellery | Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2d211a;
      --muted: #765f4d;
      --cream: #fff8ec;
      --gold: #9b641f;
      --line: #ead9be;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(216, 169, 93, 0.2), transparent 34%),
        linear-gradient(135deg, #fffaf1, var(--cream));
      font-family: "DM Sans", sans-serif;
      text-align: center;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 6vw, 64px);
      border: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.9);
      box-shadow: 0 30px 80px rgba(67, 43, 21, 0.14);
    }

    p:first-child {
      margin: 0 0 14px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 8vw, 72px);
      font-weight: 500;
      line-height: 1;
    }

    p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    a {
      color: var(--gold);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p>Nivara Jewellery</p>
    <h1>We’ll be back shortly.</h1>
    <p>Our website is getting a small refresh. For orders or questions, please contact us on WhatsApp or Instagram.</p>
    <p><a href="https://wa.me/917899890736">WhatsApp: +91 78998 90736</a></p>
  </main>
</body>
</html>
